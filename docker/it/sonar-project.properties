# Scanner configuration for the BW5 integration-test project.
# The sources are assembled at run time by docker/integration-test.sh, which
# copies the BW5 sample (src/test/resources/bw/bw5/SonarSamples) next to this
# file into the scanner workspace.
sonar.projectKey=bw5-it-sample
sonar.projectName=BW5 Integration Test Sample
sonar.projectVersion=1.0

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Only .process files are indexed as the bw5 language (plugin default).
sonar.bw5.file.suffixes=.process

# Keep the scanner focused on the sample; nothing here is Java/other langs.
sonar.exclusions=**/.scannerwork/**
