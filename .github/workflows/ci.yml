name: CI Pipeline

on:
  push:
    branches:
      - 'main'
      - 'develop'
      - 'release/**'
  pull_request:
    branches:
      - 'main'
      - 'develop'
      - 'release/**'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:19.03.12
        options: --privileged
    env:
      MAVEN_CLI_OPTS: "-s ci_settings.xml"
      MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Build with Maven (includes SpotBugs, PMD and Checkstyle)
        run: mvn $MAVEN_CLI_OPTS clean initialize verify
        env:
          MAVEN_OPTS: ${{ secrets.MAVEN_OPTS }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonar-bw
          path: ./target


  test:
    runs-on: ubuntu-latest
    needs: build
    env:
      MAVEN_CLI_OPTS: "-s ci_settings.xml"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Run tests with JaCoCo
        run: mvn $MAVEN_CLI_OPTS clean org.jacoco:jacoco-maven-plugin:prepare-agent test jacoco:report

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/jacoco.xml

  deploy:
    runs-on: ubuntu-latest
    needs: test
    env:
      MAVEN_CLI_OPTS: "-s ci_settings.xml"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Extract Maven project version
        run: echo ::set-output name=version::$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
        id: project

      - name: Determine Version
        id: version
        run: |
          if [ "${GITHUB_REF_NAME}" == "main" ]; then
            echo "Keeping version as is"
          else
            mvn $MAVEN_CLI_OPTS versions:set -DgenerateBackupPoms=false -DnewVersion=${{ steps.project.outputs.version }}-SNAPSHOT
          fi

      - name: Deploy with maven with Maven
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]] || [[ "${GITHUB_REF_NAME}" =~ "release/" ]]; then
            mvn $MAVEN_CLI_OPTS deploy
          fi
        env:
          MAVEN_OPTS: ${{ secrets.MAVEN_OPTS }}


  # Runs independently of `deploy` so a slow or unavailable NVD service never
  # blocks a release. Only executes on main / release branches.
  vulnerability-check:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'release/')
    timeout-minutes: 30
    env:
      MAVEN_CLI_OPTS: "-s ci_settings.xml"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      # Rolling cache of the NVD database: a unique key always saves a fresh
      # copy, restore-keys brings back the latest one so updates stay incremental.
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: nvd-data-

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: OWASP dependency-check
        run: |
          KEY_ARG=""
          [ -n "$NVD_API_KEY" ] && KEY_ARG="-DnvdApiKey=$NVD_API_KEY"
          mvn $MAVEN_CLI_OPTS org.owasp:dependency-check-maven:10.0.3:check $KEY_ARG
        env:
          MAVEN_OPTS: ${{ secrets.MAVEN_OPTS }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*

  visualize:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Convert JaCoCo to Cobertura
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            registry.gitlab.com/haynes/jacoco2cobertura:latest \
            python /opt/cover2cover.py /workspace/target/site/jacoco/jacoco.xml /workspace/src/main/java/ > ${{ github.workspace }}/target/site/cobertura.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-report
          path: ${{ github.workspace }}/target/site/cobertura.xml
